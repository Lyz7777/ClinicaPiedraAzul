services:
  - type: web
    name: clinica-api
    runtime: node
    rootDir: backend/clinica-api
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma db push
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-db
          property: connectionString
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: clinica-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: clinica-api
          type: web
          property: hostport
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinica-db
    plan: free
    databaseName: clinica
    ipAllowList: []