services:
  - type: web
    name: clinica-api
    runtime: node
    rootDir: backend/clinica-api
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-db
          property: connectionString

  - type: static
    name: clinica-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinica-db
    plan: free